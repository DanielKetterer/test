# genimage layout for the QEMU vexpress-a9 SD card image.
#
# Partition map (MBR):
#   p1  FAT32  32 MB   — boot files (zImage, DTB, boot.scr)
#   p2  ext4   256 MB  — root filesystem
#
# U-Boot is NOT in the image; QEMU loads it directly via -kernel u-boot.bin.

image boot.vfat {
    vfat {
        files = {
            "zImage",
            "vexpress-v2p-ca9.dtb",
            "boot.scr",
        }
    }
    size = 32M
}

image sdcard.img {
    hdimage {
        gpt = false
    }

    partition boot {
        partition-type = 0x0C
        bootable = "true"
        image = "boot.vfat"
    }

    partition rootfs {
        partition-type = 0x83
        image = "rootfs.ext4"
    }
}
